[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localportal-cli"
version = "0.1.0"
description = "Mirror any website on 127.0.0.1 through a local reverse proxy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adem Kouki" }]
keywords = ["proxy", "reverse-proxy", "mirror", "localhost", "aiohttp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Environment :: Console",
]
dependencies = ["aiohttp>=3.10"]

[project.urls]
Homepage = "https://github.com/Ademking/localportal"
Issues = "https://github.com/Ademking/localportal/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
localportal = "localportal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
